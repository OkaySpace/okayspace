<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OkaySpace</title>
<meta name="description" content="A safe place to check in, feel heard, and find support. Free, private and no account needed.">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#3E5B47">
<!-- Content-Security-Policy: the only third-party script is GoatCounter analytics (gc.zgo.at + your okayspace.goatcounter.com). Replace okayspace below, in the script tag and in the Privacy page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://okayspace.goatcounter.com; base-uri 'none'; form-action 'none'">
<style>
:root {
  --bg: #FBF6EC; --card: #FFFFFF; --soft: #EEF3EA; --ink: #26332A; --muted: #5A665C; --line: #DDE3D5;
  --sage: #A8BFA6; --sage-deep: #3E5B47; --on-deep: #FBF6EC; --peach: #F2C9B1; --peach-deep: #B5654A; --focus: #9A4A2E;
  --radius: 22px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #172019; --card: #1F2B22; --soft: #243228; --ink: #EEF1E8; --muted: #AEB9AE; --line: #34443A;
    --sage: #6F8C70; --sage-deep: #A8BFA6; --on-deep: #172019; --peach: #5A4034; --peach-deep: #F2C9B1; --focus: #F2C9B1;
  }
}
:root[data-theme="dark"] {
  --bg: #172019; --card: #1F2B22; --soft: #243228; --ink: #EEF1E8; --muted: #AEB9AE; --line: #34443A;
  --sage: #6F8C70; --sage-deep: #A8BFA6; --on-deep: #172019; --peach: #5A4034; --peach-deep: #F2C9B1; --focus: #F2C9B1;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; }
html[data-size="1"] { font-size: 112.5%; }
html[data-size="2"] { font-size: 125%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: "Avenir Next", "Nunito", "Segoe UI", system-ui, -apple-system, "Noto Sans", "Noto Sans Devanagari", "Noto Sans Arabic", sans-serif; font-size: 1.0625rem; line-height: 1.65; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Noto Serif", serif; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(2rem, 8vw, 3.2rem); font-weight: 700; }
h2 { font-size: clamp(1.5rem, 5vw, 2rem); font-weight: 700; margin-bottom: .5rem; }
h3 { font-size: 1.2rem; font-weight: 700; margin-bottom: .35rem; }
p { margin: 0; }
p + p { margin-top: .75rem; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--sage-deep); font-weight: 600; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
.skip { position: absolute; inset-inline-start: 8px; top: -60px; background: var(--sage-deep); color: var(--on-deep); padding: 10px 16px; border-radius: 10px; z-index: 100; }
.skip:focus { top: 8px; }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 980px; margin: 0 auto; padding: 10px 16px 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
.brand { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 9px; font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 700; font-size: 1.15rem; color: var(--ink); text-align: start; }
.right { display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.home-top, .menu-top { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 42px; padding: 8px 13px; border-radius: 999px; font-weight: 700; cursor: pointer; }
.home-top { background: var(--sage-deep); color: var(--on-deep); border: 1.5px solid var(--sage-deep); }
.home-top:not([aria-current="page"]) { background: transparent; color: var(--muted); border-color: var(--line); }
.menu-top { background: var(--soft); color: var(--ink); border: 1.5px solid var(--line); }
.menu-top:hover, .menu-top:focus-visible { border-color: var(--sage-deep); background: var(--sage); }
select#lang { background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 12px; font-size: .9rem; font-weight: 600; }
.urgentbtn { background: var(--peach); color: #3A241B; border: 1.5px solid var(--peach-deep); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: .9rem; white-space: nowrap; }
:root[data-theme="dark"] .urgentbtn { color: #F7E6DC; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .urgentbtn { color: #F7E6DC; } }
.links { max-width: 980px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; padding: 6px 12px 10px; scrollbar-width: none; }
.links::-webkit-scrollbar { display: none; }
.links button { flex: none; background: transparent; border: 0; color: var(--muted); font-weight: 600; padding: 8px 14px; border-radius: 999px; font-size: .95rem; }
.links button[aria-current="page"] { background: var(--sage-deep); color: var(--on-deep); }
.links .home-tab, .links .menu-tab { display: inline-flex; align-items: center; justify-content: center; gap: 7px; flex: none; border: 0; font-weight: 700; padding: 9px 15px; border-radius: 999px; font-size: .95rem; }
.links .home-tab { background: var(--sage-deep); color: var(--on-deep); }
.links .home-tab:not([aria-current="page"]) { background: transparent; color: var(--muted); }
.links .menu-tab { background: var(--soft); color: var(--ink); border: 1px solid var(--line); }
.links .menu-tab:hover, .links .menu-tab:focus-visible { background: var(--sage); color: var(--ink); }

main { max-width: 980px; margin: 0 auto; padding: 28px 20px 48px; outline: none; }
.lead { color: var(--muted); max-width: 60ch; }
.notice { background: var(--soft); border-inline-start: 5px solid var(--sage); border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; font-size: .95rem; }
.small { font-size: .9rem; color: var(--muted); }

/* hero */
.hero { display: grid; gap: 24px; align-items: center; margin-bottom: 28px; }
@media (min-width: 760px) { .hero { grid-template-columns: 1.2fr .8fr; } }
.welcome { font-family: "Iowan Old Style", Georgia, serif; font-size: 1.3rem; margin: 12px 0 10px; color: var(--sage-deep); }
.art { width: 100%; max-width: 360px; justify-self: center; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; margin-bottom: 18px; }
.card.soft { background: var(--soft); border-color: transparent; }
.grid2 { display: grid; gap: 14px; }
@media (min-width: 700px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.grid3 { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
@media (min-width: 700px) { .grid3 { grid-template-columns: repeat(3, 1fr); } }

.btn { display: inline-block; border: 0; border-radius: 14px; padding: 13px 20px; font-weight: 700; background: var(--sage-deep); color: var(--on-deep); text-align: center; min-height: 46px; }
.btn.ghost { background: transparent; border: 1.5px solid var(--sage-deep); color: var(--ink); }
.btn.peach { background: var(--peach); color: #3A241B; border: 1.5px solid var(--peach-deep); }
:root[data-theme="dark"] .btn.peach { color: #F7E6DC; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.peach { color: #F7E6DC; } }
.btn.sm { padding: 9px 16px; font-size: .95rem; min-height: 40px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.tile { background: var(--card); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; text-align: start; font-weight: 700; min-height: 64px; }
.tile:hover { border-color: var(--sage-deep); }
.tile.big { background: var(--soft); border-color: transparent; font-size: 1.05rem; }

/* mood */
.moods { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-top: 14px; }
.mood { display: flex; align-items: center; gap: 10px; border: 2px solid var(--line); background: var(--card); border-radius: 16px; padding: 12px; font-weight: 600; text-align: start; min-height: 52px; }
.mood .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--ink); }
.mood[aria-pressed="true"] { border-color: var(--sage-deep); background: var(--soft); }
.mood[aria-pressed="true"]::after { content: "\2713"; margin-inline-start: auto; font-weight: 700; }
.reply { background: var(--soft); border-inline-start: 5px solid var(--sage-deep); border-radius: 14px; padding: 18px; margin-top: 16px; }

/* forms */
textarea, input[type=text], select.field { width: 100%; border: 1.5px solid var(--line); border-radius: 14px; background: var(--bg); padding: 13px; line-height: 1.5; }
textarea { min-height: 130px; resize: vertical; }
label.l { display: block; font-size: .92rem; color: var(--muted); font-weight: 600; margin: 12px 0 6px; }
input[type=range] { width: 100%; accent-color: var(--sage-deep); }

/* calm */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 9px 16px; font-weight: 600; font-size: .95rem; }
.chip[aria-pressed="true"] { background: var(--sage-deep); color: var(--on-deep); border-color: var(--sage-deep); }
.stage { display: grid; place-items: center; height: 280px; position: relative; }
.orb { width: 210px; height: 210px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F2C9B1, #A8BFA6 78%); transform: scale(.55); }
.orbtext { position: absolute; text-align: center; color: #26332A; pointer-events: none; max-width: 150px; }
.orbtext .ph { font-family: "Iowan Old Style", Georgia, serif; font-weight: 700; font-size: 1.15rem; line-height: 1.2; }
.orbtext .ct { font-size: 2.2rem; font-weight: 700; line-height: 1.1; }
.slow { animation: slow 9s ease-in-out infinite; }
@keyframes slow { 0%, 100% { transform: scale(.6); } 50% { transform: scale(1); } }
.step { background: var(--soft); border-radius: 16px; padding: 20px; min-height: 130px; }
.step h3 { font-size: 1.3rem; }
.progress { font-size: .9rem; color: var(--muted); margin-bottom: 6px; }

/* journal and lists */
.entry { border-top: 1px solid var(--line); padding: 14px 0; }
.entry:first-child { border-top: 0; }
.entry .m { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-bottom: 4px; }
.entry .tx { white-space: pre-wrap; overflow-wrap: anywhere; }
.entry .pq { font-weight: 600; font-size: .95rem; margin-bottom: 2px; }
.link { background: none; border: 0; padding: 4px 6px; text-decoration: underline; color: var(--muted); font-size: .9rem; }
.tinylist { display: grid; gap: 10px; margin-top: 12px; }
.tiny { display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--soft); border-radius: 14px; padding: 12px 14px; }
.tiny[data-picked="true"] { outline: 2px solid var(--sage-deep); }
.confirm { background: var(--peach); color: #3A241B; border-radius: 14px; padding: 14px; margin-top: 12px; }
:root[data-theme="dark"] .confirm { color: #F7E6DC; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .confirm { color: #F7E6DC; } }

/* learn */
details { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 0 18px; margin-top: 10px; }
summary { cursor: pointer; padding: 16px 0; font-weight: 700; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; font-size: 1.4rem; color: var(--muted); }
details[open] summary::after { content: "\2013"; }
details .body { padding-bottom: 16px; }
details .body p { color: var(--ink); }
details .body .when { background: var(--soft); border-radius: 10px; padding: 10px 14px; margin-top: 12px; font-size: .95rem; }
details .body .src { margin-top: 10px; font-size: .9rem; color: var(--muted); }

ul.plain { margin: 8px 0 0; padding-inline-start: 22px; }
ul.plain li { margin: 6px 0; }
.quote { background: var(--soft); border-radius: 14px; padding: 14px 16px; margin-top: 10px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.alert { background: var(--sage-deep); color: var(--on-deep); border-radius: 18px; padding: 18px 20px; margin-bottom: 18px; }
.alert h2, .alert h3 { color: inherit; }
.line { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.line:first-child { border-top: 0; }
.line span { display: block; color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }


.screen-back { margin: 0 0 14px; }
.screen-back .btn { min-height: 42px; }
footer { border-top: 1px solid var(--line); padding: 28px 20px calc(60px + env(safe-area-inset-bottom, 0px)); }
footer .in { max-width: 980px; margin: 0 auto; }
footer nav { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 12px; }
footer nav button { background: none; border: 0; padding: 6px 0; color: var(--sage-deep); font-weight: 700; text-decoration: underline; }
.toast { position: fixed; inset-inline: 0; margin: 0 auto; width: fit-content; max-width: 90%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-size: .95rem; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 50; text-align: center; }
.toast.show { opacity: 1; }
html[data-calm="1"] *, html[data-calm="1"] *::before, html[data-calm="1"] *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* creator profile on About page */
.creator-profile { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; gap: 22px; }
.creator-photo-wrap { width: 150px; aspect-ratio: 4 / 5; border-radius: 20px; overflow: hidden; background: var(--soft); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(38,51,42,.10); }
.creator-photo { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center 28%; }
.creator-kicker { color: var(--peach-deep); font-size: .82rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; margin-bottom: 5px; }
.creator-name { font-size: clamp(1.6rem, 5vw, 2.25rem); margin-bottom: 9px; }
.creator-role { margin: 0 0 12px; color: var(--sage-deep); }
.creator-bio { color: var(--muted); max-width: 58ch; }
.creator-socials { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.creator-social { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 9px 15px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); text-decoration: none; font-weight: 700; }
.creator-social:hover { border-color: var(--sage-deep); background: var(--soft); }
.creator-social:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
@media (max-width: 520px) { .creator-profile { grid-template-columns: 100px minmax(0, 1fr); align-items: start; gap: 15px; } .creator-photo-wrap { width: 100px; border-radius: 16px; } .creator-socials { grid-column: 1 / -1; } }
@media (max-width: 360px) { .creator-profile { grid-template-columns: 1fr; } .creator-photo-wrap { width: 120px; } }


/* what would help right now */
#qaWrap { align-items: stretch; }
.qa-item { min-width: 0; }
.qa-tile { display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; gap: 10px; width: 100%; min-height: 150px; padding: 20px; text-align: start; background: var(--card); border: 1.5px solid var(--line); border-radius: 22px; box-shadow: 0 8px 24px rgba(38,51,42,.06); transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease, background .18s ease; }
.qa-tile:hover { transform: translateY(-2px); border-color: var(--sage-deep); box-shadow: 0 12px 28px rgba(38,51,42,.10); }
.qa-tile[aria-expanded="true"] { background: var(--soft); border-color: var(--sage-deep); }
.qa-icon { display: grid; place-items: center; width: 46px; height: 46px; border-radius: 15px; background: var(--soft); font-size: 1.35rem; }
.qa-copy { display: grid; gap: 4px; }
.qa-copy strong { font-size: 1.08rem; }
.qa-copy span { color: var(--muted); font-size: .92rem; line-height: 1.45; }
.qa-sign { align-self: flex-end; font-size: 1.35rem; color: var(--muted); line-height: 1; }
.qa-panel { background: var(--soft); border: 1px solid var(--line); border-radius: 18px; margin-top: 8px; padding: 18px; display: grid; gap: 12px; }
.qa-panel p { color: var(--muted); }
.qa-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.qa-panel a.btn, .qa-panel button.btn { text-decoration: none; }

/* calm corner: put every tool choice at the top so nothing important is hidden below the fold */
.calm-picker { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 20px 0 16px; }
.calm-choice { min-height: 108px; padding: 15px; border: 1.5px solid var(--line); border-radius: 18px; background: var(--card); color: var(--ink); text-align: start; display: flex; flex-direction: column; justify-content: space-between; gap: 7px; }
.calm-choice:hover { border-color: var(--sage-deep); background: var(--soft); }
.calm-choice[aria-pressed="true"] { border-color: var(--sage-deep); background: var(--soft); box-shadow: inset 0 0 0 1px var(--sage-deep); }
.calm-choice strong { font-size: .98rem; }
.calm-choice span { color: var(--muted); font-size: .82rem; line-height: 1.35; }
.calm-choice .calm-icon { font-size: 1.25rem; }

.creator-socials { flex-direction: column; align-items: flex-start; }
.creator-social { overflow-wrap: anywhere; }

/* slide-in menu (opens from the Home tab) */
.drawer-scrim { position: fixed; inset: 0; background: rgba(20,26,22,.45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 59; }
.drawer-scrim.show { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; bottom: 0; inset-inline-start: 0; width: min(86vw, 360px); background: var(--bg); color: var(--ink); z-index: 60; display: flex; flex-direction: column; overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 34px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px); border-start-end-radius: 28px; border-end-end-radius: 28px; box-shadow: 0 0 40px rgba(0,0,0,.25); transform: translateX(-104%); visibility: hidden; transition: transform .28s ease, visibility .28s; }
html[dir="rtl"] .drawer { transform: translateX(104%); }
.drawer.open { transform: none; visibility: visible; }
.dr-title { font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif; font-weight: 700; font-size: 2.1rem; letter-spacing: -.02em; padding: 0 10px 22px; }
.dr-nav { display: flex; flex-direction: column; gap: 2px; }
.dr-item, .dr-recent { display: flex; align-items: center; gap: 16px; width: 100%; background: transparent; border: 0; color: var(--ink); text-align: start; padding: 14px 12px; border-radius: 14px; font-size: 1.1rem; min-height: 54px; }
.dr-item svg, .dr-recent svg { flex: none; width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.dr-item[aria-current="page"], .dr-recent:hover, .dr-item:hover { background: var(--soft); }
.dr-line { border: 0; border-top: 1px solid var(--line); margin: 16px 8px 12px; width: calc(100% - 16px); }
.dr-h { color: var(--muted); font-size: 1.05rem; padding: 4px 12px 8px; }
.dr-recent { font-size: 1.05rem; min-height: 48px; padding: 11px 12px; }
.dr-recent svg { width: 20px; height: 20px; color: var(--muted); margin-inline: 3px; }
.dr-recent span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dr-foot { margin-top: auto; padding-top: 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dr-avatar { flex: none; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--peach-deep); color: #fff; font-weight: 700; font-size: 1.05rem; }
.dr-cta { flex: 1; max-width: 230px; min-height: 56px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 1.02rem; padding: 0 20px; }

/* friendlier, app-like layout */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.bar { flex-wrap: nowrap; padding: 10px 14px; }
.left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.menu-top { width: 44px; padding: 0; font-size: 1.3rem; }
.right { flex-wrap: nowrap; }
@media (max-width: 470px) { .urgentbtn { padding: 8px 11px; font-size: .85rem; } select#lang { max-width: 100px; padding: 8px; } }
@media (max-width: 420px) { .brand span { display: none; } }
body { padding-bottom: 92px; }
.tabbar { position: fixed; inset-inline: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; gap: 4px; background: var(--card); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
.tabbar button { flex: 1; max-width: 130px; min-width: 0; min-height: 56px; background: none; border: 0; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; color: var(--muted); font-size: .78rem; font-weight: 700; }

  TS: ["Ku sha ruwa kaɗan.", "Ku ci wani abu, idan ba ku ci ba kuma kuna iya ci.", "Ku huta ko ku yi ɗan hutu kaɗan.", "Ku buɗe taga ko ku fita waje kaɗan, idan ba shi da haɗari.", "Ku wanke fuska ko ku canza tufafi.", "Ku aika saƙo ga wanda kuka amince da shi.", "Ku huta daga kafafen sada zumunta.", "Ku gyara ƙaramin wuri ɗaya, idan hakan yana da sauƙi a gare ku.", "Ku nemi wani ya taimaka muku da wani aiki.", "Ku ba kanku izinin hutawa ba tare da yi wa kanku hukunci ba."],

  ST: ["Ban ji kamar kaina ba a ɗan lokacin nan. Za ku iya sauraren ni na ɗan lokaci?", "Abubuwa na yi mini wahala, kuma ba na so in ɗauki komai ni kaɗai.", "Ba na bukatar ku warware komai. Ina bukatar wani ya saurare ni kawai.", "Za ku sami ɗan lokaci mu yi magana?", "Yaya kuke ji da gaske a kwanan nan?"],

function moodOut() {
  if (!mood) return "";
  const acts = ACTS[mood].map(a => `<button class="btn ghost sm" data-go="${ACT_GO[a][0]}" data-sub="${ACT_GO[a][1]}">${esc(t(a))}</button>`).join("");
  return `<div class="reply"><h3>${esc(A("E")[mood])}</h3><p>${esc(A("S")[mood])}</p>
  <div class="btns">${acts}</div>
  <div class="btns">${moodSaved ? `<span class="small" role="status">${esc(t("mood_saved"))}</span>` : `<button class="btn sm" data-act="saveMood">${esc(t("mood_save"))}</button>`}<button class="btn ghost sm" data-act="skipMood">${esc(t("mood_skip"))}</button></div>
  <p class="small" style="margin-top:12px">${esc(t("mood_more"))} <button class="link" data-view="support" data-anchor="urgent">${esc(t("urgent_link"))}</button></p></div>`;
}
function vGuide() {
  const choices = [
    ["support", "I need support", "I want to talk to someone or find help."],
    ["calmer", "I want to feel calmer", "Try a gentle exercise or a quiet moment."],
    ["feelings", "I want to understand my feelings", "Check in with yourself and explore what you feel."],
    ["someone", "I want to support someone else", "Find ways to listen, ask and show care."]
  ];
  const selected = choices.find(x => x[0] === guideChoice) || choices[1];
  const detail = {
    support: `<h3>You don't have to handle everything alone.</h3><p>Consider speaking with someone you trust, such as a friend, family member, teacher, community leader or health professional. You can start with: “I've been finding things hard and I'd like to talk.”</p><button class="btn ghost" data-view="support">View support options</button>`,
    calmer: `<h3>Let's make room for one calm moment.</h3><p>Try a slow breathing exercise, grounding with your senses, or gentle body relaxation. Stop if anything feels uncomfortable.</p><button class="btn ghost" data-view="calm">Open calming exercises</button>`,
    feelings: `<h3>Start with a kind check-in.</h3><p>You don't need to label everything perfectly. Notice what you're feeling, what may have contributed to it, and what you need in this moment.</p><button class="btn ghost" data-view="my" data-anchor="sec-reflect">Open reflection tools</button>`,
    someone: `<h3>Being present can matter more than having the perfect words.</h3><p>Ask privately and gently, “How are you really?” Listen without judging, avoid rushing to fix things, and check in again later.</p><button class="btn ghost" data-view="talk">Explore ways to talk and listen</button>`
  };
  return `<h1 id="pgh">What would help right now?</h1><p class="lead">A simple guided path. You can go back and change your choice at any time.</p>
    ${guideStep === 0 ? `<section class="card"><div class="choices" role="group" aria-label="Choose what would help">${choices.map(([id,title,desc]) => `<button class="tile big" data-guide-choice="${id}" aria-pressed="${guideChoice===id}"><strong>${title}</strong><span>${desc}</span></button>`).join("")}</div><div class="btns" style="margin-top:18px"><button class="btn" data-act="guideNext">Next →</button></div></section>` : `<section class="card soft"><p class="small">YOUR CHOICE</p><h2>${selected[1]}</h2>${detail[guideChoice]}<div class="btns" style="margin-top:20px"><button class="btn ghost" data-act="guideBack">← Back</button><button class="btn" data-act="guideNext">Next →</button></div><p class="small">Next will show another helpful step. You can always return to your choice.</p></section>`}`;
}

  <section class="card" aria-labelledby="mq"><h2 id="mq">${esc(t("mood_q"))}</h2><p class="small">${esc(t("mood_hint"))}</p>
    <div class="moods" role="group" aria-labelledby="mq">${EMO.map(([k, c]) => `<button class="mood" data-mood="${k}" aria-pressed="${mood === k}"><span class="dot" style="background:${c}"></span>${esc(A("E")[k])}</button>`).join("")}</div>
    <div id="moodOut" aria-live="polite">${moodOut()}</div></section>
  <section class="card post" lang="en" dir="ltr"><div class="post-top"><span class="av" aria-hidden="true">\u2726</span><div><strong>OkaySpace</strong> <span class="small">\u00b7 for you today</span></div></div>

}

function entriesHTML() {
  const e = [...data.journal].sort((a, b) => b.ts - a.ts);
  if (!e.length) return `<p class="small">${esc(t("jr_empty"))}</p>`;
  return e.map(x => `<div class="entry"><div class="m"><span>${esc(fmtDate(x.ts))}</span><span><button class="link" data-act="editJ" data-id="${x.id}">${esc(t("jr_edit"))}</button><button class="link" data-act="delJ" data-id="${x.id}">${esc(t("jr_del"))}</button></span></div>${x.p ? `<div class="pq">${esc(x.p)}</div>` : ""}<div class="tx">${esc(x.t)}</div></div>`).join("");
}
function checksHTML() {
  const c = [...data.checks].sort((a, b) => b.ts - a.ts);
  if (!c.length) return `<p class="small">${esc(t("ck_none"))}</p>`;
  return c.map(x => `<div class="entry"><div class="m"><span>${esc(fmtDate(x.ts))}</span><button class="link" data-act="delC" data-id="${x.id}">${esc(t("jr_del"))}</button></div><div class="tx">${esc((A("E")[x.mood]) || x.mood)}</div></div>`).join("");
}

}

function stepper(id, items, doneKey) {
  const i = stp[id], n = items.length;
  if (i >= n) return `<div class="step" role="status"><h3>${esc(t("st_done"))}</h3><p>${esc(t(doneKey))}</p></div><div class="btns"><button class="btn" data-st="${id}" data-act="restart">${esc(t("st_again"))}</button></div>`;
  return `<div class="step"><p class="progress">${i + 1} / ${n}</p><h3>${esc(items[i][0])}</h3><p>${esc(items[i][1])}</p></div>
  <div class="btns">${i > 0 ? `<button class="btn ghost" data-st="${id}" data-act="prev">${esc(t("st_prev"))}</button>` : ""}<button class="btn ghost" data-st="${id}" data-act="next">${esc(t("st_skip"))}</button><button class="btn" data-st="${id}" data-act="next">${esc(t("st_next"))}</button></div>`;
}
function calmBody() {

    <div class="btns" style="justify-content:center"><button class="btn" id="brBtn" data-act="brToggle">${esc(t("br_begin"))}</button></div>

}

function calmPicker() {
  const tools = [
    ["breath", "cm_t_breath", "br_lead", "🫁"],
    ["ground", "cm_t_ground", "gr_lead", "🌿"],
    ["body", "cm_t_body", "bd_lead", "🧘"],
    ["over", "cm_t_over", "ov_lead", "🤍"],
    ["quiet", "cm_t_quiet", "qs_lead", "🌙"]
  ];
  return `<div class="calm-picker" role="group" aria-label="${esc(t("cm_h"))}">${tools.map(([k, title, desc, icon]) => `<button class="calm-choice" data-calm="${k}" aria-pressed="${calmTab === k}"><span class="calm-icon" aria-hidden="true">${icon}</span><strong>${esc(t(title))}</strong><span>${esc(t(desc))}</span></button>`).join("")}</div>`;
}
